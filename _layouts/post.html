---
layout: default
---
<article class="post wrap">
  <a class="post-back" href="{{ '/' | relative_url }}">&larr; Back to blog</a>
  <p class="post-meta mono">{{ page.date | date: "%B %-d, %Y" }}{% if page.reading_time %} · {{ page.reading_time }} min read{% endif %}</p>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-content">
    {{ content }}
  </div>
</article>
